<title>PRU 2027 Sales Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="app-css">
__THEME__
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif)}
.wrap{max-width:1320px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 10px}
.draft{display:inline-block;background:var(--warn-bg);color:var(--warn-ink);font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:8px 0 16px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.ct{font-weight:700;margin-bottom:4px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;margin-bottom:12px}
.controls label,.f{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
select,input[type=number],input[type=text]{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=number]{width:84px;text-align:right}
input[type=text]{width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;background:var(--input);color:var(--ink);border:0;padding:6px 12px;cursor:pointer}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--card)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft)}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.grp td,tr.grp td:first-child{font-weight:700;background:var(--bg)}
tr.head td,tr.head td:first-child{font-weight:700;color:var(--muted);background:var(--bg);font-size:12px}
tr.sub td{font-weight:700}
td.zero{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 0}
.legend span::before{content:"";display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--c)}
svg text{fill:var(--muted);font-size:11px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--input);color:var(--ink);border-radius:7px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.5;cursor:default}
.mini{font-size:12px;padding:3px 8px}
.edited{background:var(--warn-bg)!important}
.months input{width:62px}
.grid12 input{width:64px}
.status{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;background:var(--accent-soft);color:var(--ink);margin-left:6px;font-weight:600}
.init{border-left:4px solid var(--accent)}
.init.off{opacity:.6;border-left-color:var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin-bottom:10px}
@media (max-width:640px){h1{font-size:19px}.kpi .v{font-size:19px}input[type=text]{width:150px}}

<script id="app-code">
(function(){
"use strict";
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const J=id=>JSON.parse(document.getElementById(id).textContent);
const RAW=J("src-data"),PL=J("src-pl"),EXTRA=J("src-extra");
const Z=()=>new Array(12).fill(0);
const sum=a=>a.reduce((s,x)=>s+(+x||0),0);
// Sergio's Q40 (2026-11-20): halves round away from zero, as Excel does (-2.5 shows -3); the float error of an exact half (7.4999999) is removed first
const RH=(v,dp)=>{const k=Math.pow(10,dp||0),a=Math.round(Math.abs(+v||0)*k*1e6)/1e6;return ((v<0?-1:1)*Math.floor(a+0.5)/k)||0;};
const F1=v=>RH(v,1).toFixed(1);
const fmtN=v=>RH(v).toLocaleString("en-US");
const fmtK=v=>Math.abs(v-Math.round(v))<0.05?fmtN(v):RH(v,1).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtD=v=>{const r=RH(v);return (r<0?"-$":"$")+Math.abs(r).toLocaleString("en-US");};
const pct=(a,b)=>b?((a-b)/Math.abs(b)*100):null;
const rnd=v=>RH(v);
// one sign-and-colour rule: judged on the figure as shown (rounded); 0 shows as 0, uncoloured, never -0
const fmtP=p=>{if(p==null)return "–";const r=rnd(p);return (r>0?"+":"")+r+"%";};
const cl=p=>p==null?"":rnd(p)>0?"up":rnd(p)<0?"down":"";
// Change % beside a Change cell: sign and colour follow the shown Change; a small non-zero change shows one decimal, never 0%
const fmtPC=(d,p)=>{const r=rnd(d);if(r===0||p==null)return r===0?"0%":"–";const s=r>0?"+":"-",a=Math.abs(p);return s+(RH(a)>=1?RH(a):RH(a,1)>=0.1?F1(a):"<0.1")+"%";};
const fmtC=(d,f)=>{const r=rnd(d);return r===0?f(0):(r>0?"+":"")+f(r);};
// shown figures (Sergio's Q38, 2026-11-20: "Each figure on its own"): every cell and every total is its own exact figure, rounded only where it is printed
function LR(a){return a.map(q=>+q||0);}
const colSum=(rows,key)=>MON.map((_,m)=>sum(rows.map(r=>r[key][m])));
// one label rule for every 2026 figure read from the Manual Log
const L26="2026 (Manual Log)";
function yL(y){return y==="2026"?L26:y;}
function yl(y){return y==="2026"?"2026 registrations (Manual Log)":y;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// ---------- state ----------
let STATE;try{STATE=J("plan-state")||{};}catch(e){STATE={};}
const DEF={fillAll:null,fillType:{},fillUnit:{},unitMonths:{},price:{},rate:{},showDirt:true,dirt:null,savedAt:null};
const FILLV=v=>Math.min(100,Math.max(0,Math.round(+v||0)));
function norm(s){s=Object.assign({},DEF,s||{});["fillType","fillUnit","unitMonths","price","rate"].forEach(k=>{s[k]=JSON.parse(JSON.stringify(s[k]||{}));});   // a fresh copy each time: state never shares an object with DEF or the caller
  s.dirt=s.dirt?JSON.parse(JSON.stringify(s.dirt)):null;if(s.fillAll!=null)s.fillAll=FILLV(s.fillAll);["fillType","fillUnit"].forEach(k=>{s[k]=Object.assign({},s[k]);Object.keys(s[k]).forEach(q=>{if(s[k][q]!=null)s[k][q]=FILLV(s[k][q]);});});return s;}
STATE=norm(STATE);
const DRAFT_KEY="pru-planner-draft-v3";
const LS_OK=(function(){try{localStorage.setItem("pru-ls-test","1");localStorage.removeItem("pru-ls-test");return true;}catch(e){return false;}})();
const NOSAVE="Inputs are not saved here; they clear when the page reloads.";
// the save line keeps its last words across re-renders and reloads (round 16, finding 9)
const ST_KEPT="Changes kept in this browser; not saved for everyone yet",ST_LOCAL="Saved in this browser only (this page cannot save for everyone here).";
let STATUS=null;
try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");if(d&&d.basedOn===(STATE.savedAt||"seed")){STATE=norm(d.state);STATUS=d.saved?ST_LOCAL:ST_KEPT;}}catch(e){}
// theme (this viewer only)
const THEME_KEY="pru-planner-theme";
function applyTheme(t){document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");}
let theme="dark";try{theme=localStorage.getItem(THEME_KEY)||"dark";}catch(e){}
if(theme!=="light")theme="dark";
applyTheme(theme);

// ---------- the Manual Log (trends and the 2026 base) ----------
function rangeOf(r){return r.replace(" (and other)","").replace(" (Skills Retest)","");}
const LINES=RAW.filter(l=>l.range!=="2021 Only").map(l=>({key:l.cls+"|"+l.range,cls:l.cls,range:rangeOf(l.range),label:l.range,n:l.n,d:l.d}));
const CLASSES=[...new Set(LINES.map(l=>l.cls))];
const RANGES=[...new Set(LINES.map(l=>l.range))].sort((a,b)=>(a==="All Locations")-(b==="All Locations")||a.localeCompare(b));
const ALL_STUDENTS_26=Z(),ALL_SALES_26=Z();
LINES.forEach(l=>{for(let m=0;m<12;m++){ALL_STUDENTS_26[m]+=l.n["2026"][m];ALL_SALES_26[m]+=l.d["2026"][m];}});
function logMonths(cls,range,meas){const o=Z();LINES.forEach(l=>{if(l.cls===cls&&(range==null||l.range===range))for(let m=0;m<12;m++)o[m]+=l[meas]["2026"][m];});return o;}
// his answers 22 and 23: Rick's 2026 is the 2026 base; the gap to the Manual Log is Rick's month less the log's month, in five named parts
const LOG26=sum(ALL_SALES_26),RICK26=EXTRA.rick2026,RICK26M=EXTRA.rick2026m,GAP26=RICK26-LOG26,GAP26M=RICK26M.map((q,m)=>q-ALL_SALES_26[m]),PARTS=EXTRA.gapParts;
const GAPNAME="Budget workbook's 2026 above the Manual Log";
const CLASSES26=EXTRA.classes2026;
// Q79, Q109: shown 2026 is Master by class date; LINES and R3.fill26 stay the 2027 budget's base
const M26=EXTRA.master26,LINES26=M26.lines.map(l=>({cls:l.cls,range:l.range,n:{"2026":l.n},d:{"2026":l.d}})),M26_N=Z();LINES26.forEach(l=>l.n["2026"].forEach((q,m)=>{M26_N[m]+=q;}));

// ---------- release 3 model: Class Data '2027 Projections' (goal accepted 2026-11-20) ----------
const R3=EXTRA.r3;
const TYPES=R3.types,SITES=R3.sites;
const SITE_RANGE={"Manassas Mall":"Manassas -  Mall","Woodbridge":"Woodbridge - Potomac Mills","Fairfax GMU":"Fairfax","Manassas GMU":"Manassas - GMU","Colonial Heights":"Colonial Heights -Southpark","Stafford":"Stafford","Newport News":"Newport News - Patrick Henry Mall","Virginia Beach":"Virginia Beach","Clarksburg":"Clarksburg (MD)"};
const LOGCLS={"2-Wheel":"2-Wheel","3-Wheel":"3-Wheel","BRC2":"BRC2","First Ride":"IME","ARC":"ARC"};
const TNAME=t=>t==="First Ride"?"First Ride (IME)":t;
const MN=[2,3,4,5,6,7,8,9,10]; // Mar-Nov, the months his fill question was read on
function fillOf(rows,type){let c=0,s=0;rows.forEach(f=>MN.forEach(m=>{c+=f.c[m];s+=f.s[m];}));return c?s/(c*R3.cap[type])*100:null;}
const FILL26_TYPE={};TYPES.concat(["ARC"]).forEach(t=>{FILL26_TYPE[t]=fillOf(Object.keys(R3.fill26).filter(k=>k.split("|")[1]===t).map(k=>R3.fill26[k]),t);});
const UNITS=R3.units.map(u=>{const key=u.site+"|"+u.type,f=R3.fill26[key],f26=f?fillOf([f],u.type):null;
  return {key,site:u.site,type:u.type,m0:u.m.slice(),how:u.how,f26,fStart:f26!=null?f26:FILL26_TYPE[u.type],
    fSrc:f26!=null?"2026 Mar–Nov at this site (Manual Log, Master, by week, as set for the 2027 budget)":"no 2026 classes here: "+TNAME(u.type)+" at all sites, 2026 Mar–Nov"};});
const CLASSES27_START=sum(UNITS.map(u=>sum(u.m0)));
// carried lines: classes with no row in his table, kept at their 2026 students (goal item 4)
const HD_N=logMonths("HD",null,"n"),HD_D=logMonths("HD",null,"d"),ARC_N=logMonths("ARC",null,"n");
const PRICE_START=Object.assign({},R3.price27,{HD:sum(HD_N)?sum(HD_D)/sum(HD_N):0});
function priceOf(t){return STATE.price[t]!=null&&STATE.price[t]!==""?+STATE.price[t]:PRICE_START[t];}
const ARC_CLS=Z(),ARC_S26=Z();Object.keys(R3.fill26).filter(k=>k.endsWith("|ARC")).forEach(k=>{R3.fill26[k].c.forEach((c,m)=>{ARC_CLS[m]+=c;});R3.fill26[k].s.forEach((q,m)=>{ARC_S26[m]+=q;});});
const CARRIED=[{key:"HD",cls:"HD",range:"Manassas - GMU",label:"HD",n:HD_N,cls26:null},{key:"ARC",cls:"ARC",range:"All Locations",label:"ARC",n:ARC_N,cls26:ARC_CLS,s26:ARC_S26}];
function rateOf(s){if(STATE.rate[s]!=null&&STATE.rate[s]!=="")return +STATE.rate[s];const r=R3.rent[s];return r?(r.renew!=null?r.renew:r.rate):0;}
// his answer 36: "Classes share weekends": weekends needed = classes x 2026 weekends used / 2026 classes, by site (Manual Log, Master)
function wkShare(s){const w=R3.weekends26[s];return w&&w.classes?w.weekends/w.classes:1;}
function storageOf(s){const r=R3.rent[s];return r&&r.storage?r.storage:0;}
function fillPct(u){const c=STATE;if(c.fillUnit[u.key]!=null)return +c.fillUnit[u.key];if(c.fillType[u.type]!=null)return +c.fillType[u.type];if(c.fillAll!=null)return +c.fillAll;return u.fStart;}
function unitPlan(u){
  const cls=STATE.unitMonths[u.key]?STATE.unitMonths[u.key].slice():u.m0.slice();
  const f=fillPct(u),cap=R3.cap[u.type],spc=cap*f/100,price=priceOf(u.type),two=+F1(spc)>6;
  const per=R3.coach[u.type][two?0:1],n=cls.map(c=>c*spc);
  return {cls,f,cap,spc,price,n,s:n.map(q=>q*price),two,coachPer:per,coach:cls.map(c=>c*per)};
}
// ARC: students per class = its 2026 students ÷ its 2026 classes, both from the Manual Log's Master sheet (as the fill % is), shown on the plan tab; the coach rule reads that figure at one decimal
function carriedPlan(c){const price=priceOf(c.key),n=c.n.slice();let coach=Z(),per=null,two=false,spc=null;
  if(c.cls26){spc=sum(c.cls26)?sum(c.s26)/sum(c.cls26):0;two=+F1(spc)>6;per=R3.coach.ARC[two?0:1];coach=c.cls26.map(q=>q*per);}
  return {price,n,s:n.map(q=>q*price),coach,coachPer:per,two,spc};}
// his answer on LDW: "LDW just figure a % to sales ad keep it" - Jan-Sep 2026, Rick's table
const LDW26=R3.ldw.v26,LDW_RATE=R3.ldw.v26/R3.ldw.fees26;
const OTHER4_26=GAP26-LDW26; // the other four parts, carried at their 2026 amounts (my pick)
const RA_CLASSES=15; // range aid classes, as in 2026 (my pick)
function planAgg(){
  const t={n:Z(),s:Z()},coach=Z(),cls=Z(),bySite={},byType={};
  SITES.forEach(s=>{bySite[s]={cls:Z(),n:Z(),s:Z()};});
  const ups=UNITS.map(u=>({u,p:unitPlan(u)}));
  ups.forEach(({u,p})=>{const bs=bySite[u.site],bt=(byType[u.type]=byType[u.type]||{cls:Z(),n:Z(),s:Z(),coach:Z()});
    for(let m=0;m<12;m++){t.n[m]+=p.n[m];t.s[m]+=p.s[m];coach[m]+=p.coach[m];cls[m]+=p.cls[m];bs.cls[m]+=p.cls[m];bs.n[m]+=p.n[m];bs.s[m]+=p.s[m];bt.cls[m]+=p.cls[m];bt.n[m]+=p.n[m];bt.s[m]+=p.s[m];bt.coach[m]+=p.coach[m];}});
  const car=CARRIED.map(c=>({c,p:carriedPlan(c)}));
  car.forEach(({p})=>{for(let m=0;m<12;m++){t.n[m]+=p.n[m];t.s[m]+=p.s[m];coach[m]+=p.coach[m];}});
  const aid=MON.map(()=>R3.rangeAid.rate*RA_CLASSES/12);
  const rentBy={};SITES.forEach(s=>{rentBy[s]=bySite[s].cls.map(c=>c*wkShare(s)*rateOf(s)+storageOf(s)/12);});
  const rent=MON.map((_,m)=>sum(SITES.map(s=>rentBy[s][m])));
  const ldw=t.s.map(q=>q*LDW_RATE),other=GAP26M.map(q=>q*OTHER4_26/GAP26);
  const gap=MON.map((_,m)=>ldw[m]+other[m]);
  return {core:t,ups,car,coach,aid,cls,bySite,byType,rentBy,rent,ldw,other,gap};
}
// 2027 lines in the log's range and class names, for the Trends tab's 2027B
function plan27Lines(agg){
  const out=agg.ups.map(({u,p})=>({range:(u.type==="2-Wheel"||u.type==="3-Wheel")?SITE_RANGE[u.site]:"All Locations",cls:LOGCLS[u.type],n:p.n,s:p.s}));
  agg.car.forEach(({c,p})=>out.push({range:c.range,cls:c.cls,n:p.n,s:p.s}));
  return out;
}
// discounts: information only (goal item 5), at 2026's claims per 2-Wheel student
function discounts(agg){const n2=sum((agg.byType["2-Wheel"]||{n:Z()}).n),k=n2/R3.students2W26;
  return [["Military",R3.disc.military[0],R3.disc.military[1],R3.disc.military[1]*k],["VIP",R3.disc.vip[0],R3.disc.vip[1],R3.disc.vip[1]*k]];}
// Dirt Bike: shown on its own, never in the P&L (these numbers stay out of the P&L)
// his Q74: edited by weekend, month by month. Start values give Class Data's plan: 2 classes a weekend (its note), one weekend a month, coach = 2 classes x its rate a class
const DIRT_CPW=2;
function dirtIn(){const d=R3.dirt,x=STATE.dirt||{},w0=d.classes/12/DIRT_CPW,at=(a,m,z)=>a&&a[m]!=null?a[m]:z;
  return {wk:MON.map((_,m)=>at(x.wk,m,w0)),cpw:MON.map((_,m)=>at(x.cpw,m,DIRT_CPW)),spc:x.spc!=null?x.spc:d.spc,rent:x.rent!=null?x.rent:d.rent,coach:x.coach!=null?x.coach:d.coach*DIRT_CPW};}
function dirtCalc(){const d=R3.dirt,I=dirtIn();
  const cls=MON.map((_,m)=>I.wk[m]*I.cpw[m]),n=cls.map(c=>c*I.spc),s=n.map(q=>q*d.price),coach=I.wk.map(w=>w*I.coach),rent=I.wk.map(w=>w*I.rent);
  return {cls,n,s,coach,rent};}

// ---------- P&L model ----------
const PLR={};PL.forEach(p=>{PLR[p.row]=p;});
const v=(r,m)=>(PLR[r]&&PLR[r].m[m])||0;
const RICK_TRAINING=MON.map((_,m)=>v(13,m)), RICK_RENT=MON.map((_,m)=>v(72,m)), RICK_SAL=MON.map((_,m)=>v(33,m)), RICK_COS=MON.map((_,m)=>v(16,m));
const TAXRATE=MON.map((_,m)=>v(100,m)?v(101,m)/v(100,m):0);
const FIXED=new Set([27,33,60,62,73,76,85,86,87,88,93,94,98]); // his answer 11 "Hold fixed costs"; Salaries 33 stays Rick's (his Q49, release 4); 16 and 72 are built below
const SUMS={14:[8,9,10,11,12,13],18:[16,17],30:[24,25,26,27,28,29],38:[33,34,35,36,37],69:[],78:[72,73,74,75,76,77],89:[85,86,87,88]};
for(let r=41;r<=68;r++)SUMS[69].push(r);
const HEADS=new Set(PL.filter(p=>p.m.every(x=>x==null)).map(p=>p.row));
function budget(salesOverride){
  const agg=planAgg();
  const sales=salesOverride||MON.map((_,m)=>agg.core.s[m]+agg.gap[m]);
  const B={};
  for(let m=0;m<12;m++){
    const f=RICK_TRAINING[m]?sales[m]/RICK_TRAINING[m]:0;
    PL.forEach(p=>{const r=p.row;if(HEADS.has(r)||r===21)return;(B[r]=B[r]||Z());
      if(r===13)B[r][m]=sales[m];
      else if(r===16)B[r][m]=salesOverride?RICK_COS[m]:agg.coach[m]+agg.aid[m];
      else if(r===72)B[r][m]=salesOverride?RICK_RENT[m]:agg.rent[m];
      else if(FIXED.has(r))B[r][m]=v(r,m);
      else if(!(r in SUMS)&&![20,80,82,91,96,100,101,103].includes(r))B[r][m]=v(r,m)*f;
    });
    Object.keys(SUMS).forEach(k=>{B[k][m]=SUMS[k].reduce((s,r)=>s+((B[r]||Z())[m]||0),0);});
    B[20][m]=B[14][m]-B[18][m];
    B[80][m]=B[30][m]+B[38][m]+B[69][m]+B[78][m];
    B[82][m]=B[20][m]-B[80][m];
    B[91][m]=B[82][m]+B[89][m];
    B[96][m]=B[91][m]-B[93][m]-B[94][m];
    B[100][m]=B[96][m]-B[98][m];

function saveBar(){return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn primary" data-save="1">Save plan</button><button class="btn" data-reset="1">Reset everything</button><span class="status" data-status="1">${STATUS!=null?esc(STATUS):LS_OK||artifactApi?(STATE.savedAt?"Saved "+esc(STATE.savedAt):"Not saved yet"):NOSAVE}</span></div>`;}
function wireSave(n){n.querySelectorAll("[data-save]").forEach(b=>b.onclick=save);n.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{if(b.dataset.armed){STATE=norm({savedAt:STATE.savedAt});changed();}else{b.dataset.armed="1";b.textContent="Click again to reset";}});}
function setStatus(t){STATUS=t;document.querySelectorAll("[data-status]").forEach(s=>s.textContent=t);}
function changed(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({basedOn:STATE.savedAt||"seed",state:STATE}));}catch(e){}render();setStatus(LS_OK?ST_KEPT:NOSAVE);}
let artifactApi=null,readOnly=false;
try{if(window.claude&&typeof window.claude.use==="function")window.claude.use("artifact").then(a=>{artifactApi=a;}).catch(()=>{});}catch(e){}
async function save(){
  if(!artifactApi){setStatus(LS_OK?ST_LOCAL:NOSAVE);try{localStorage.setItem(DRAFT_KEY,JSON.stringify({basedOn:STATE.savedAt||"seed",state:STATE,saved:true}));}catch(e){}return;}
  if(readOnly){setStatus("This view is read-only.");return;}
  document.querySelectorAll("[data-save]").forEach(b=>b.disabled=true);
  const st=Object.assign({},STATE,{savedAt:new Date().toLocaleString("en-US",{dateStyle:"medium",timeStyle:"short"})});
  const j=s=>JSON.stringify(s).replace(/</g,"\\u003c");
  const raw=id=>document.getElementById(id).textContent;
  const body="<title>PRU 2027 Sales Planner</title>\n"+'<meta name="claude:viewport-fit-sides" content="cover">\n<style id="app-css">'+raw("app-css")+'</style>\n<div id="root"></div>\n'
   +'<script type="application/json" id="plan-state">'+j(st)+'<\/script>\n'
   +["src-data","src-pl","src-extra"].map(id=>'<script type="application/json" id="'+id+'">'+raw(id)+'<\/script>\n').join("")
   +'<script id="app-code">'+raw("app-code")+'<\/script>';
  const html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style></head><body>'+body+'</body></html>';
