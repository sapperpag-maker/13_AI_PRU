body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif)}
.wrap{max-width:1320px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:8px 0 16px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.ct{font-weight:700;margin-bottom:4px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;margin-bottom:12px}

select,input[type=number],input[type=text]{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:6px 8px}

input[type=text]{width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;background:var(--input);color:var(--ink);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--card)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft)}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.grp td,tr.grp td:first-child{font-weight:700;background:var(--bg)}
tr.head td,tr.head td:first-child{font-weight:700;color:var(--muted);background:var(--bg);font-size:12px}
tr.sub td{font-weight:700}
td.zero{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 0}
.legend span::before{content:"";display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--c)}
svg text{fill:var(--muted);font-size:11px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--input);color:var(--ink);border-radius:7px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.5;cursor:default}
.mini{font-size:12px;padding:3px 8px}
.edited{background:var(--warn-bg)!important}
.months input{width:62px}
.grid12 input{width:64px}
.status{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;background:var(--accent-soft);color:var(--ink);margin-left:6px;font-weight:600}
.init{border-left:4px solid var(--accent)}
.init.off{opacity:.6;border-left-color:var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin-bottom:10px}

const RENT_RANGES=RANGES.filter(r=>r!=="All Locations");
function rentTable(agg){
  // start value: Rick's rent split by each range's share of the month's plan sales (his answer 15)
  const out={};
  RENT_RANGES.forEach(r=>out[r]=Z());
  for(let m=0;m<12;m++){
    let tot=0;RENT_RANGES.forEach(r=>tot+=(agg.byRange[r]||Z())[m]);

function budget(salesOverride){

  const rt=rentTable(agg);

  for(let m=0;m<12;m++){
    const f=RICK_TRAINING[m]?sales[m]/RICK_TRAINING[m]:0;
    PL.forEach(p=>{const r=p.row;if(HEADS.has(r)||r===21)return;(B[r]=B[r]||Z());
      if(r===13)B[r][m]=sales[m];
      else if(r===33)B[r][m]=RICK_SAL[m]*ppc/PAY_BASE+((salesOverride?CLASSES26[m]:cls27[m])-CLASSES26[m]+(salesOverride?0:agg.it.classes[m]))*ppc;
      else if(r===72){let t=0;RENT_RANGES.forEach(x=>t+=rt[x][m]);B[r][m]=(salesOverride?RICK_RENT[m]:t+agg.it.rent[m]);}
      else if(FIXED.has(r))B[r][m]=v(r,m);
      else if(!(r in SUMS)&&![20,80,82,91,96,100,101,103].includes(r))B[r][m]=v(r,m)*f;
    });
    Object.keys(SUMS).forEach(k=>{B[k][m]=SUMS[k].reduce((s,r)=>s+((B[r]||Z())[m]||0),0);});
    B[20][m]=B[14][m]-B[18][m];
    B[80][m]=B[30][m]+B[38][m]+B[69][m]+B[78][m];
    B[82][m]=B[20][m]-B[80][m];

    B[96][m]=B[91][m]-B[93][m]-B[94][m];
    B[100][m]=B[96][m]-B[98][m];

  if(V.inits)activeInits().forEach(i=>{if((V.range==="All"||i.range===V.range)&&(V.cls==="All"||i.cls===V.cls)){const c=initCalc(i);for(let m=0;m<12;m++)a27[m]+=meas==="n"?c.n[m]:c.sales[m];}});

  <tr><td>2026 actual</td>${a26.map(q=>`<td>${f(q)}</td>`).join("")}<td><b>${f(sum(a26))}</b></td></tr>

  box.appendChild(tc);

// TAB 4: new initiatives
function newInit(type){
  const id="i"+Date.now().toString(36);
  const base={id,type,on:true,start:1,months:Z(),price:Math.round(sum(ALL_SALES_26)/Math.max(1,sum(ALL_STUDENTS_26))),spc:+SPC26.toFixed(1),rentMonth:0};
  if(type==="range")return Object.assign(base,{name:"New range",range:"New range",cls:"2-Wheel"});
  return Object.assign(base,{name:"New class",range:"All Locations",cls:"New class"});
}

  <div class="row"><button class="btn primary" id="add-r">+ New range</button><button class="btn" id="add-c">+ New class</button>${saveBar()}</div>`;

      :`<label class="f">Class name<input type="text" data-f="cls" value="${esc(it.cls)}"></label><label class="f">Range<select data-f="range">${RANGES.map(x=>`<option ${x===it.range?"selected":""}>${esc(x)}</option>`).join("")}</select></label>`;
    card.innerHTML=`<div class="row"><label class="f">Name<input type="text" data-f="name" value="${esc(it.name)}"></label>${rangeField}
      <label class="f">Starts<select data-f="start">${MON.map((m,i)=>`<option value="${i+1}" ${it.start===i+1?"selected":""}>${m}</option>`).join("")}</select></label>
      <label class="f">Price per student<input type="number" step="1" data-f="price" value="${it.price}"></label>

      <button class="btn mini" data-del="1">Remove</button></div>
      <div class="row"><label class="f">Fill: students in the year<input type="number" step="10" data-fill="1" placeholder="e.g. 300"></label><span class="note">spreads them over the open months like 2026's pattern, all ranges</span></div>
      <div class="tw grid12"><table><thead><tr><th></th>${MON.map(m=>`<th>${m}</th>`).join("")}<th>Year</th></tr></thead><tbody>
      <tr><td>Students</td>${c.n.map((q,m)=>`<td><input type="number" min="0" step="1" data-mo="${m}" value="${it.months[m]||0}" ${m<it.start-1?"disabled":""} aria-label="${MON[m]} students"></td>`).join("")}<td>${fmtN(sum(c.n))}</td></tr>
      <tr><td>Sales</td>${c.sales.map(q=>`<td>${fmtD(q)}</td>`).join("")}<td><b>${fmtD(sales)}</b></td></tr>
      <tr><td>Classes</td>${c.classes.map(q=>`<td>${fmtN(q)}</td>`).join("")}<td>${fmtN(sum(c.classes))}</td></tr>

      ${it.type==="range"?`<tr><td>Rent</td>${c.rent.map(q=>`<td>${fmtD(q)}</td>`).join("")}<td>${fmtD(rent)}</td></tr>`:""}
      <tr class="sub"><td>Sales less coach pay${it.type==="range"?" and rent":""}</td>${MON.map((_,m)=>`<td>${fmtD(c.sales[m]-c.classes[m]*ppc-c.rent[m])}</td>`).join("")}<td>${fmtD(sales-coach-rent)}</td></tr></tbody></table></div>
      <p class="note">Other costs (cost of sales, selling and admin lines) are added on the P&L tab in proportion to sales.</p>`;
    const set=(k,val)=>{STATE.inits[idx][k]=val;changed();};
    card.querySelectorAll("[data-f]").forEach(inp=>inp.onchange=e=>{const k=inp.dataset.f;let val=inp.type==="checkbox"?inp.checked:inp.value;if(["start","price","spc","rentMonth"].includes(k))val=+val||0;if(k==="name"&&!val)val="Untitled";set(k,val);});
    card.querySelectorAll("[data-mo]").forEach(inp=>inp.onchange=e=>{const a=(it.months||Z()).slice();a[+inp.dataset.mo]=Math.max(0,Math.round(+e.target.value||0));set("months",a);});
    card.querySelector("[data-fill]").onchange=e=>{const tot=+e.target.value||0;const st=it.start-1;const w=ALL_STUDENTS_26.map((q,m)=>m<st?0:q);const ws=sum(w)||1;
      const a=w.map(q=>Math.floor(tot*q/ws));let left=tot-sum(a);for(let m=11;m>=st&&left>0;m--){if(w[m]){a[m]++;left--;}}set("months",a);};
    card.querySelector("[data-del]").onclick=()=>{STATE.inits.splice(idx,1);changed();};

  return box;
}

   +kp("Gross profit",fmtD(yr(20)),`Rick's ${fmtD(ry(20))}`)

   <tr><td>Classes held 2026</td>${CLASSES26.map(q=>`<td>${fmtN(q)}</td>`).join("")}<td>${fmtN(sum(CLASSES26))}</td></tr>
   <tr><td>Classes 2027</td>${b.cls27.map((q,m)=>`<td><input type="number" min="0" step="1" data-cm="${m}" value="${q}" class="${STATE.classes?"edited":""}" aria-label="${MON[m]} classes 2027"></td>`).join("")}<td>${fmtN(sum(b.cls27))}</td></tr>
   <tr><td>+ initiatives' classes</td>${agg.it.classes.map(q=>`<td>${fmtN(q)}</td>`).join("")}<td>${fmtN(sum(agg.it.classes))}</td></tr>
   <tr><td>Students per class 2026</td>${MON.map((_,m)=>`<td>${CLASSES26[m]?(ALL_STUDENTS_26[m]/CLASSES26[m]).toFixed(1):"–"}</td>`).join("")}<td>${SPC26.toFixed(1)}</td></tr>
   <tr><td>Students per class 2027</td>${spc27.map(q=>`<td>${q?q.toFixed(1):"–"}</td>`).join("")}<td>${sum(b.cls27)?(sum(agg.core.n)/sum(b.cls27)).toFixed(1):"–"}</td></tr>
   <tr class="sub"><td>Salaries & Wages</td>${B[33].map(q=>`<td>${fmtD(q)}</td>`).join("")}<td>${fmtD(sum(B[33]))}</td></tr></tbody></table></div>
   <p class="note">Salaries & Wages each month = Rick's month × (pay per class ÷ ${fmtD(PAY_BASE)}) + (2027 classes − 2026 classes + initiatives' classes) × pay per class. December 2026 classes are those booked so far.</p>`;
  ic.querySelector("#ppc").onchange=e=>{const x=e.target.value;STATE.payPerClass=x===""?null:+x;changed();};
  ic.querySelector("#cfol").onchange=e=>{STATE.classesFollow=e.target.checked;changed();};
  const cr=ic.querySelector("#creset");if(cr)cr.onclick=()=>{STATE.classes=null;changed();};
  ic.querySelectorAll("[data-cm]").forEach(inp=>inp.onchange=e=>{const a=classes27(planAgg());a[+inp.dataset.cm]=Math.max(0,Math.round(+e.target.value||0));STATE.classes=a;changed();});
  wireSave(ic);box.appendChild(ic);
  // rent by range
  const rc=el("div",{class:"card"});const rt=b.rt;
  let rh=`<div class="ct">Monthly rent by range</div><p class="note" style="margin:0 0 8px">Start values: Rick's monthly Rent split across ranges by each range's share of that month's 2027 plan sales. Type over any month to set it; clear a box to go back. The weekend rate is from the log's “26 Rent Schedule” tab, as a guide.</p>
   <div class="tw grid12"><table><thead><tr><th>Range</th><th>Weekend rate</th>${MON.map(m=>`<th>${m}</th>`).join("")}<th>Year</th></tr></thead><tbody>`;
  RENT_RANGES.forEach(r=>{const ov=STATE.rent[r]||[];rh+=`<tr data-r="${esc(r)}"><td>${esc(r)}</td><td>${esc(EXTRA.rentRates[r]||"–")}</td>${rt[r].map((q,m)=>`<td><input type="number" min="0" step="50" data-rm="${m}" value="${Math.round(q)}" class="${ov[m]!=null&&ov[m]!==""?"edited":""}" aria-label="${esc(r)} ${MON[m]} rent"></td>`).join("")}<td>${fmtD(sum(rt[r]))}</td></tr>`;});

  if(sum(initRent))rh+=`<tr><td>New ranges (initiatives)</td><td></td>${initRent.map(q=>`<td>${fmtD(q)}</td>`).join("")}<td>${fmtD(sum(initRent))}</td></tr>`;

  box.appendChild(rc);
  // P&L
  const pc=el("div",{class:"card"});
  const view=BV.view;
  const val=(r,m)=>view==="plan"?B[r][m]:view==="rick"?v(r,m):B[r][m]-v(r,m);
  let h=`<div class="row"><div class="ct" style="margin:0">P&L by month</div><div class="seg"><button data-v="plan" aria-pressed="${view==="plan"}">2027 with the plan</button><button data-v="rick" aria-pressed="${view==="rick"}">Rick's budget</button><button data-v="diff" aria-pressed="${view==="diff"}">Difference</button></div></div>

    if(HEADS.has(r)){h+=`<tr class="head"><td>${esc(p.label)}</td><td colspan="13"></td></tr>`;return;}

    const row=MON.map((_,m)=>val(r,m));if(!SUBS.has(r)&&row.every(q=>Math.abs(q)<0.5)&&MON.every((_,m)=>Math.abs(v(r,m))<0.5))return;
    const tag=r===13?'<span class="tag">from plan</span>':r===33?'<span class="tag">pay per class</span>':r===72?'<span class="tag">by range</span>':FIXED.has(r)?'<span class="tag">fixed $</span>':"";
    h+=`<tr class="${SUBS.has(r)?"sub":""}"><td${SUBS.has(r)?"":' style="padding-left:22px"'}>${esc(p.label)}${tag}</td>${row.map(q=>`<td class="${Math.abs(q)<0.5?"zero":""}">${Math.abs(q)<0.5?"–":fmtD(q)}</td>`).join("")}<td>${fmtD(sum(row))}</td></tr>`;});
  h+=`</tbody></table></div><p class="note">How lines move (his answer 11, “Hold fixed costs”): each month, every line moves by that month's 2027 sales ÷ Rick's Training, so cost of sales keeps each month's margin. These stay in Rick's dollars: Training Fleet Depreciation, Insurance - Other, Depreciation-Other, Leasehold Amortz. & Building Depr., Insurance - Building, interest and other income. Salaries & Wages follow the classes and the pay per class; Rent is the range table. Income tax keeps Rick's rate for each month. Lines that are zero in every view are hidden.</p>`;
  pc.innerHTML=h;pc.querySelectorAll("[data-v]").forEach(bt=>bt.onclick=()=>{BV.view=bt.dataset.v;render();});
  box.appendChild(pc);
  const ch=el("div",{class:"card"});ch.appendChild(el("div",{class:"ct"},"Operating profit by month"));
  const s=[{y:"rick",v:rick(82)},{y:"2027",v:B[82]}];ch.appendChild(chart(s,fmtD));ch.appendChild(legend([["rick","Rick's budget"],["2027","2027 with the plan"]]));box.appendChild(ch);
  return box;
}

// ---------- save ----------
function saveBar(){return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn primary" data-save="1">Save plan</button><button class="btn" data-reset="1">Reset everything</button><span class="status" data-status="1">${LS_OK||artifactApi?(STATE.savedAt?"Saved "+esc(STATE.savedAt):"Not saved yet"):NOSAVE}</span></div>`;}
function wireSave(n){n.querySelectorAll("[data-save]").forEach(b=>b.onclick=save);n.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{if(b.dataset.armed){STATE=norm({savedAt:STATE.savedAt});changed();}else{b.dataset.armed="1";b.textContent="Click again to reset";}});}
function setStatus(t){document.querySelectorAll("[data-status]").forEach(s=>s.textContent=t);}
function changed(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({basedOn:STATE.savedAt||"seed",state:STATE}));}catch(e){}render();setStatus(LS_OK?"Changes kept in this browser; not saved for everyone yet":NOSAVE);}
let artifactApi=null,readOnly=false;
try{if(window.claude&&typeof window.claude.use==="function")window.claude.use("artifact").then(a=>{artifactApi=a;}).catch(()=>{});}catch(e){}
async function save(){
  if(!artifactApi){setStatus(LS_OK?"Saved in this browser only (this page cannot save for everyone here).":NOSAVE);try{localStorage.setItem(DRAFT_KEY,JSON.stringify({basedOn:STATE.savedAt||"seed",state:STATE}));}catch(e){}return;}
  if(readOnly){setStatus("This view is read-only.");return;}
  document.querySelectorAll("[data-save]").forEach(b=>b.disabled=true);
  const st=Object.assign({},STATE,{savedAt:new Date().toLocaleString("en-US",{dateStyle:"medium",timeStyle:"short"})});
  const j=s=>JSON.stringify(s).replace(/</g,"\\u003c");
  const raw=id=>document.getElementById(id).textContent;
  const body="<title>PRU 2027 Sales Planner</title>\n"+'<meta name="claude:viewport-fit-sides" content="cover">\n<style id="app-css">'+raw("app-css")+'</style>\n<div id="root"></div>\n'
   +'<script type="application/json" id="plan-state">'+j(st)+'<\/script>\n'
   +["src-data","src-pl","src-extra"].map(id=>'<script type="application/json" id="'+id+'">'+raw(id)+'<\/script>\n').join("")
   +'<script id="app-code">'+raw("app-code")+'<\/script>';
  const html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style></head><body>'+body+'</body></html>';
  try{try{localStorage.removeItem(DRAFT_KEY);}catch(e){}await artifactApi.publish(html);setStatus("Saved");}
  catch(e){const c=e&&e.code;
    if(c==="not_writer"||c==="not_granted"){readOnly=true;setStatus("This view is read-only: you can try numbers, but cannot save them.");}
    else if(c==="conflict")setStatus("Someone saved a newer plan; loading it.");
    else setStatus("Not saved ("+(c||"error")+"). Your changes are kept in this browser.");
    try{localStorage.setItem(DRAFT_KEY,JSON.stringify({basedOn:STATE.savedAt||"seed",state:STATE}));}catch(_){}}
  finally{document.querySelectorAll("[data-save]").forEach(b=>b.disabled=false);}
}
window.__PRU_TEST__={budget,PL,RICK_TRAINING,SELFTEST,planAgg,LINES,CLASSES26,PAY_BASE};
render();
})();
