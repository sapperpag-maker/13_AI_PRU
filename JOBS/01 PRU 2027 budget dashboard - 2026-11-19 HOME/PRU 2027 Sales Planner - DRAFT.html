*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 14px}
.draft{display:inline-block;background:var(--warn-bg);color:var(--warn-ink);font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 16px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;margin-bottom:12px}
.controls label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=number]{width:84px;text-align:right}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;background:var(--input);color:var(--ink);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft)}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.grp td{font-weight:700;background:var(--bg)}
tr.grp td:first-child{background:var(--bg)}
td.zero{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 0}
.legend span::before{content:"";display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--c)}
svg text{fill:var(--muted);font-size:11px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--input);color:var(--ink);border-radius:7px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.mini{font-size:12px;padding:3px 8px}
.edited{background:var(--warn-bg)!important}
.months input{width:62px}
.status{font-size:12px;color:var(--muted)}
.flow td:first-child{font-weight:700}
@media (max-width:640px){h1{font-size:19px}.kpi .v{font-size:19px}}

<script id="app-code">
(function(){
"use strict";
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const YEARS=["2022","2023","2024","2025","2026"];
const RAW=JSON.parse(document.getElementById("src-data").textContent);
let STATE;
try{STATE=JSON.parse(document.getElementById("plan-state").textContent)||{};}catch(e){STATE={};}
const DEFAULT_STATE={baseline:"2026",growth:0,priceChange:0,lines:{},savedAt:null};
STATE=Object.assign({},DEFAULT_STATE,STATE);STATE.lines=STATE.lines||{};
// local draft (this viewer only)
const DRAFT_KEY="pru-planner-draft-v1";
try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");if(d&&d.basedOn===(STATE.savedAt||"seed")){STATE=Object.assign({},STATE,d.state);}}catch(e){}

// ---- data model ----
function rangeOf(r){return r.replace(" (and other)","").replace(" (Skills Retest)","");}
const LINES=RAW.filter(l=>l.range!=="2021 Only").map(l=>{
  const key=l.cls+"|"+l.range;
  const range=rangeOf(l.range);
  return {key,cls:l.cls,range,label:l.range,n:l.n,d:l.d};
});
const CLASSES=[...new Set(LINES.map(l=>l.cls))];
const RANGES=[...new Set(LINES.map(l=>l.range))].sort((a,b)=>(a==="All Locations")-(b==="All Locations")||a.localeCompare(b));
const sum=a=>a.reduce((s,x)=>s+(+x||0),0);
const fmtN=v=>Math.round(v).toLocaleString("en-US");
const fmtD=v=>"$"+Math.round(v).toLocaleString("en-US");
const pct=(a,b)=>b?((a-b)/b*100):null;
const fmtP=p=>p==null?"–":(p>=0?"+":"")+p.toFixed(0)+"%";
const cls=p=>p==null?"":p>=0?"up":"down";
// class average price per student, latest year with data
function classPrice(c){for(const y of ["2026","2025","2024","2023"]){let n=0,d=0;LINES.filter(l=>l.cls===c).forEach(l=>{n+=sum(l.n[y]);d+=sum(l.d[y]);});if(n>0&&d>0)return {p:d/n,src:"class average "+y};}return {p:0,src:"none"};}
function defaultPrice(l){for(const y of ["2026","2025","2024","2023"]){const n=sum(l.n[y]),d=sum(l.d[y]);if(n>0&&d>0)return {p:d/n,src:y+" average"};}return classPrice(l.cls);}
LINES.forEach(l=>{const dp=defaultPrice(l);l.dp=dp.p;l.dpSrc=dp.src;});

function baselineMonths(l){
  const b=STATE.baseline;
  if(b==="avg3"){return MON.map((_,m)=>(l.n["2024"][m]+l.n["2025"][m]+l.n["2026"][m])/3);}
  return l.n[b].slice();
}
function lineCfg(l){return STATE.lines[l.key]||{};}
function plan(l){
  const c=lineCfg(l);
  const g=(c.g!=null?c.g:STATE.growth)/100;
  const price=c.price!=null?c.price:l.dp*(1+STATE.priceChange/100);
  const base=baselineMonths(l);
  const months=c.months?c.months.slice():base.map(v=>Math.round(v*(1+g)));
  const n=sum(months);
  return {g:g*100,price,months,n,sales:n*price,salesM:months.map(v=>v*price),edited:!!(c.g!=null||c.price!=null||c.months)};
}

// ---- rendering helpers ----
const root=document.getElementById("root");
let tab="trends";
const T={measure:"n",cls:"All",year:"2026",sel:"Total"};
const P={open:null};
function el(tag,attrs,html){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==="class")e.className=attrs[k];else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  root.innerHTML="";
  const w=el("div",{class:"wrap"});
  w.appendChild(el("h1",null,'PRU 2027 Sales Planner<span class="draft">DRAFT · not checked</span>'));
  w.appendChild(el("p",{class:"sub"},"Students and sales by range, class and month. Source: 2026 PRU Manual Log v3, tab “WklyConsolidating Wd” (month-to-date and prior-year columns)."));
  const tb=el("div",{class:"tabs",role:"tablist"});
  [["trends","Monthly trends by range"],["plan","2027 plan"]].forEach(([id,lab])=>{
    const b=el("button",{class:"tab",role:"tab","aria-selected":String(tab===id)},lab);
    b.onclick=()=>{tab=id;render();};tb.appendChild(b);
  });
  w.appendChild(tb);
  w.appendChild(tab==="trends"?renderTrends():renderPlan());
  root.appendChild(w);
}

// ---- TAB 1: monthly trends by range ----
function seriesFor(range,clsF,measure,year){
  const out=new Array(12).fill(0);
  LINES.forEach(l=>{if((range==="Total"||l.range===range)&&(clsF==="All"||l.cls===clsF)){const a=l[measure][year];for(let m=0;m<12;m++)out[m]+=a[m]||0;}});
  return out;
}
function renderTrends(){
  const box=el("div");
  const meas=T.measure,f=meas==="n"?fmtN:fmtD;
  const years=meas==="d"?YEARS.filter(y=>y!=="2022"):YEARS;
  if(meas==="d"&&T.year==="2022")T.year="2026";
  const ctr=el("div",{class:"controls"});
  ctr.innerHTML=`<div><div class="note" style="margin-bottom:4px">Show</div><div class="seg"><button data-m="n" aria-pressed="${meas==="n"}">Students</button><button data-m="d" aria-pressed="${meas==="d"}">Sales $</button></div></div>
  <label>Class<select id="t-cls"><option>All</option>${CLASSES.map(c=>`<option ${c===T.cls?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
  <label>Year in table<select id="t-year">${years.map(y=>`<option ${y===T.year?"selected":""}>${y}</option>`).join("")}</select></label>`;
  ctr.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{T.measure=b.dataset.m;render();});
  ctr.querySelector("#t-cls").onchange=e=>{T.cls=e.target.value;render();};
  ctr.querySelector("#t-year").onchange=e=>{T.year=e.target.value;render();};
  box.appendChild(ctr);
  box.appendChild(el("div",{class:"warn"},"2026: November is month-to-date and December holds bookings so far, so both will still grow. 2022 has students only, no dollars."));

  // chart
  const card=el("div",{class:"card"});
  card.appendChild(el("div",{style:"font-weight:700;margin-bottom:4px"},esc(T.sel==="Total"?"All ranges":T.sel)+" · "+(meas==="n"?"students":"sales $")+" by month"+(T.cls!=="All"?" · "+esc(T.cls):"")));
  card.appendChild(el("div",{class:"note"},"Click a range in the table to chart it."));
  const ser=years.map(y=>({y,v:seriesFor(T.sel,T.cls,meas,y)}));
  card.appendChild(chart(ser,f));
  const lg=el("div",{class:"legend"});
  ser.forEach(s=>{const sp=el("span",{style:`--c:var(--y${s.y})`},s.y+": "+f(sum(s.v)));lg.appendChild(sp);});
  card.appendChild(lg);
  box.appendChild(card);

  // table
  const tc=el("div",{class:"card"});
  const prior=String(+T.year-1);
  const hasPrior=years.includes(prior);
  let h=`<div class="tw"><table><thead><tr><th>Range</th>${MON.map(m=>`<th>${m}</th>`).join("")}<th>${T.year}</th>${hasPrior?`<th>${prior}</th><th>Change</th>`:""}</tr></thead><tbody>`;
  const rows=RANGES.map(r=>({r,v:seriesFor(r,T.cls,meas,T.year),p:hasPrior?seriesFor(r,T.cls,meas,prior):null}))
    .filter(x=>sum(x.v)>0||(x.p&&sum(x.p)>0));
  rows.forEach(x=>{const t=sum(x.v),pt=x.p?sum(x.p):0,pc=pct(t,pt);
    h+=`<tr class="click${T.sel===x.r?" sel":""}" data-r="${esc(x.r)}"><td>${esc(x.r)}</td>${x.v.map(v=>`<td class="${v?"":"zero"}">${v?f(v):"–"}</td>`).join("")}<td><b>${f(t)}</b></td>${hasPrior?`<td>${f(pt)}</td><td class="${cls(pc)}">${fmtP(pc)}</td>`:""}</tr>`;});
  const tv=seriesFor("Total",T.cls,meas,T.year),tp=hasPrior?seriesFor("Total",T.cls,meas,prior):null;
  const tt=sum(tv),tpp=tp?sum(tp):0;
  h+=`<tr class="tot click${T.sel==="Total"?" sel":""}" data-r="Total"><td>All ranges</td>${tv.map(v=>`<td>${f(v)}</td>`).join("")}<td>${f(tt)}</td>${hasPrior?`<td>${f(tpp)}</td><td class="${cls(pct(tt,tpp))}">${fmtP(pct(tt,tpp))}</td>`:""}</tr>`;
  h+="</tbody></table></div>";
  tc.innerHTML=h;
  tc.querySelectorAll("tr.click").forEach(tr=>tr.onclick=()=>{T.sel=tr.dataset.r;render();});
  box.appendChild(tc);
  box.appendChild(el("p",{class:"note"},"Ranges with no students in the year shown or the year before are left out. “All Locations” holds ARC, BRC2, IME and Other, which the log does not split by range."));
  return box;
}
function chart(series,f){
  const W=900,H=260,pl=58,pr=12,pt=10,pb=26;
  let max=0;series.forEach(s=>s.v.forEach(v=>{if(v>max)max=v;}));
  if(max<=0)max=1;
  const step=niceStep(max/4);const top=Math.ceil(max/step)*step;
  const x=m=>pl+(W-pl-pr)*m/11, y=v=>pt+(H-pt-pb)*(1-v/top);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly trend chart" style="display:block;max-height:300px">`;
  for(let v=0;v<=top+1e-9;v+=step){s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${f(v)}</text>`;}
  MON.forEach((m,i)=>{s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${m}</text>`;});
  series.forEach(se=>{const last=se.y==="2026"||se.y==="2027";
    const pts=se.v.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    s+=`<polyline fill="none" stroke="var(--y${se.y})" stroke-width="${last?3:1.8}" points="${pts}"${se.dash?' stroke-dasharray="6 4"':''}><title>${se.y}</title></polyline>`;
    if(last)se.v.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--y${se.y})"><title>${se.y} ${MON[i]}: ${f(v)}</title></circle>`;});
  });
  s+="</svg>";
  const d=el("div");d.innerHTML=s;return d;
}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r)));const n=r/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p;}

// ---- TAB 2: 2027 plan ----
function totals(){
  const t={n:new Array(12).fill(0),s:new Array(12).fill(0),n26:0,s26:0,n25:0,s25:0};
  LINES.forEach(l=>{const p=plan(l);for(let m=0;m<12;m++){t.n[m]+=p.months[m];t.s[m]+=p.salesM[m];}t.n26+=sum(l.n["2026"]);t.s26+=sum(l.d["2026"]);t.n25+=sum(l.n["2025"]);t.s25+=sum(l.d["2025"]);});
  return t;
}
function renderPlan(){
  const box=el("div");
  const t=totals(),N=sum(t.n),S=sum(t.s);
  const k=el("div",{class:"kpis"});
  const kp=(l,v,d)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
  k.innerHTML=kp("2027 students",fmtN(N),`<span class="${cls(pct(N,t.n26))}">${fmtP(pct(N,t.n26))}</span> vs 2026 (${fmtN(t.n26)})`)
   +kp("2027 sales",fmtD(S),`<span class="${cls(pct(S,t.s26))}">${fmtP(pct(S,t.s26))}</span> vs 2026 (${fmtD(t.s26)})`)
   +kp("Average price per student",fmtD(N?S/N:0),`2026: ${fmtD(t.n26?t.s26/t.n26:0)}`)
   +kp("vs 2025 actual",fmtP(pct(S,t.s25)),`2025: ${fmtN(t.n25)} students, ${fmtD(t.s25)}`);
  box.appendChild(k);

  const ctr=el("div",{class:"card"});
  ctr.innerHTML=`<div class="controls" style="margin:0">
   <label>Start from<select id="p-base"><option value="2026" ${STATE.baseline==="2026"?"selected":""}>2026 actual</option><option value="2025" ${STATE.baseline==="2025"?"selected":""}>2025 actual</option><option value="avg3" ${STATE.baseline==="avg3"?"selected":""}>Average 2024–2026</option></select></label>
   <label>Student growth, all lines<input type="number" id="p-g" step="1" value="${STATE.growth}"></label>
   <label>Price change, all lines<input type="number" id="p-pc" step="0.5" value="${STATE.priceChange}"></label>
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="p-save">Save plan</button><button class="btn" id="p-reset">Reset to start values</button><span class="status" id="p-status">${STATE.savedAt?"Saved "+esc(STATE.savedAt):"Not saved yet"}</span></div>
  </div><p class="note" style="margin:8px 0 0">Growth and price are in %. A line's own growth, price or months, once typed, override these. Months follow the chosen year's pattern for that line. ${STATE.baseline==="2026"?"Note: 2026 November and December are not complete, so they start low.":""}</p>`;
  ctr.querySelector("#p-base").onchange=e=>{STATE.baseline=e.target.value;changed();};
  ctr.querySelector("#p-g").onchange=e=>{STATE.growth=+e.target.value||0;changed();};
  ctr.querySelector("#p-pc").onchange=e=>{STATE.priceChange=+e.target.value||0;changed();};
  ctr.querySelector("#p-save").onclick=save;
  ctr.querySelector("#p-reset").onclick=()=>{STATE=Object.assign({},DEFAULT_STATE,{lines:{},savedAt:STATE.savedAt});changed();};
  box.appendChild(ctr);

  // plan table by range
  const tc=el("div",{class:"card"});
  let h=`<div class="tw"><table><thead><tr><th>Range / class</th><th>2025 students</th><th>2026 students</th><th>Growth %</th><th>2027 students</th><th>Price</th><th>2027 sales</th><th>vs 2026 sales</th><th></th></tr></thead><tbody>`;
  RANGES.forEach(r=>{
    const ls=LINES.filter(l=>l.range===r);
    const ps=ls.map(plan);
    const any=ls.some(l=>YEARS.some(y=>sum(l.n[y])>0));
    if(!any)return;
    const n25=sum(ls.map(l=>sum(l.n["2025"]))),n26=sum(ls.map(l=>sum(l.n["2026"]))),s26=sum(ls.map(l=>sum(l.d["2026"])));
    const n27=sum(ps.map(p=>p.n)),s27=sum(ps.map(p=>p.sales));
    h+=`<tr class="grp"><td>${esc(r)}</td><td>${fmtN(n25)}</td><td>${fmtN(n26)}</td><td></td><td>${fmtN(n27)}</td><td></td><td>${fmtD(s27)}</td><td class="${cls(pct(s27,s26))}">${fmtP(pct(s27,s26))}</td><td></td></tr>`;
    ls.forEach((l,i)=>{const p=ps[i];
      if(!YEARS.some(y=>sum(l.n[y])>0))return;
      const c=lineCfg(l);const s26l=sum(l.d["2026"]);
      const name=l.cls+(l.label!==l.range?" "+l.label.replace(l.range,"").trim():"");
      h+=`<tr data-k="${esc(l.key)}"><td style="padding-left:22px">${esc(name)}</td><td>${fmtN(sum(l.n["2025"]))}</td><td>${fmtN(sum(l.n["2026"]))}</td>
      <td><input type="number" step="1" class="in-g${c.g!=null?" edited":""}" value="${c.months?"":(+p.g.toFixed(1))}" ${c.months?'disabled title="Months typed by hand"':""}></td>
      <td>${fmtN(p.n)}</td>
      <td><input type="number" step="1" class="in-p${c.price!=null?" edited":""}" value="${Math.round(p.price)}" title="Start value: ${esc(l.dpSrc)} ${fmtD(l.dp)}"></td>
      <td>${fmtD(p.sales)}</td><td class="${cls(pct(p.sales,s26l))}">${fmtP(pct(p.sales,s26l))}</td>
      <td><button class="btn mini in-m">${P.open===l.key?"Close":"Months"}</button>${p.edited?' <button class="btn mini in-x" title="Back to start values">↺</button>':""}</td></tr>`;
      if(P.open===l.key){
        h+=`<tr class="months" data-k="${esc(l.key)}"><td colspan="9"><div class="tw"><table><tr><th></th>${MON.map(m=>`<th>${m}</th>`).join("")}</tr>
        <tr><td>2026 actual</td>${l.n["2026"].map(v=>`<td>${fmtN(v)}</td>`).join("")}</tr>
        <tr><td>2025 actual</td>${l.n["2025"].map(v=>`<td>${fmtN(v)}</td>`).join("")}</tr>
        <tr><td><b>2027 plan</b></td>${p.months.map((v,m)=>`<td><input type="number" step="1" min="0" class="in-mo${c.months?" edited":""}" data-m="${m}" value="${v}"></td>`).join("")}</tr></table></div>
        <p class="note">Typing a month fixes all 12 months of this line by hand; growth % is then ignored for it.</p></td></tr>`;
      }
    });
  });
  h+=`<tr class="tot"><td>All ranges</td><td>${fmtN(t.n25)}</td><td>${fmtN(t.n26)}</td><td></td><td>${fmtN(N)}</td><td></td><td>${fmtD(S)}</td><td class="${cls(pct(S,t.s26))}">${fmtP(pct(S,t.s26))}</td><td></td></tr></tbody></table></div>`;
  tc.innerHTML=h;
  tc.querySelectorAll("tr[data-k]").forEach(tr=>{
    const key=tr.dataset.k;const cfg=()=>(STATE.lines[key]=STATE.lines[key]||{});
    const g=tr.querySelector(".in-g");if(g)g.onchange=e=>{const v=e.target.value;if(v===""){delete cfg().g;}else cfg().g=+v;changed();};
    const pr=tr.querySelector(".in-p");if(pr)pr.onchange=e=>{const v=e.target.value;if(v===""){delete cfg().price;}else cfg().price=+v;changed();};
    const mb=tr.querySelector(".in-m");if(mb)mb.onclick=()=>{P.open=P.open===key?null:key;render();};
    const xb=tr.querySelector(".in-x");if(xb)xb.onclick=()=>{delete STATE.lines[key];changed();};
    tr.querySelectorAll(".in-mo").forEach(inp=>inp.onchange=e=>{const l=LINES.find(z=>z.key===key);const cur=plan(l).months;cur[+inp.dataset.m]=Math.max(0,Math.round(+e.target.value||0));cfg().months=cur;changed();});
  });
  box.appendChild(tc);

  // flow into budget
  const fc=el("div",{class:"card"});
  const n26m=seriesFor("Total","All","n","2026"),s26m=seriesFor("Total","All","d","2026");
  fc.innerHTML=`<div style="font-weight:700;margin-bottom:4px">2027 by month — this is what flows into the budget</div>
  <div class="tw"><table class="flow"><thead><tr><th></th>${MON.map(m=>`<th>${m}</th>`).join("")}<th>Year</th></tr></thead><tbody>
  <tr><td>2027 students</td>${t.n.map(v=>`<td>${fmtN(v)}</td>`).join("")}<td>${fmtN(N)}</td></tr>
  <tr><td>2027 sales</td>${t.s.map(v=>`<td>${fmtD(v)}</td>`).join("")}<td>${fmtD(S)}</td></tr>
  <tr><td style="font-weight:400">2026 students</td>${n26m.map(v=>`<td>${fmtN(v)}</td>`).join("")}<td>${fmtN(sum(n26m))}</td></tr>
  <tr><td style="font-weight:400">2026 sales</td>${s26m.map(v=>`<td>${fmtD(v)}</td>`).join("")}<td>${fmtD(sum(s26m))}</td></tr></tbody></table></div>`;
  const ser=[{y:"2026",v:s26m},{y:"2027",v:t.s}];
  fc.appendChild(chart(ser,fmtD));
  const lg=el("div",{class:"legend"});ser.forEach(s=>lg.appendChild(el("span",{style:`--c:var(--y${s.y})`},s.y+" sales")));fc.appendChild(lg);
  box.appendChild(fc);
  box.appendChild(el("p",{class:"note"},"Start price for each line = that line's 2026 sales ÷ 2026 students (or the latest year with sales; else the class average). Hover a price box to see where its start value came from."));
  return box;
}

// ---- state: local draft + shared save ----
function changed(){
  try{localStorage.setItem(DRAFT_KEY,JSON.stringify({basedOn:STATE.savedAt||"seed",state:STATE}));}catch(e){}
  const st=document.getElementById("p-status");
  render();
  const st2=document.getElementById("p-status");if(st2)st2.textContent="Changes not saved yet";
}
let artifactApi=null,readOnly=false;
try{if(window.claude&&typeof window.claude.use==="function"){window.claude.use("artifact").then(a=>{artifactApi=a;}).catch(()=>{});}}catch(e){}
function setStatus(t){const s=document.getElementById("p-status");if(s)s.textContent=t;}
async function save(){
  if(!artifactApi){setStatus("Saving is not available in this view. Your changes are kept in this browser only.");return;}
  if(readOnly){setStatus("This view is read-only.");return;}
  const btn=document.getElementById("p-save");if(btn)btn.disabled=true;
  const st=Object.assign({},STATE,{savedAt:new Date().toLocaleString("en-US",{dateStyle:"medium",timeStyle:"short"})});
  const j=s=>JSON.stringify(s).replace(/</g,"\\u003c");
  const css=document.getElementById("app-css").textContent;
  const code=document.getElementById("app-code").textContent;
  const data=document.getElementById("src-data").textContent;
  const meta='<meta name="claude:viewport-fit-sides" content="cover">';
  const body="<title>PRU 2027 Sales Planner</title>\n"+meta+'\n<style id="app-css">'+css+'</style>\n<div id="root"></div>\n<script type="application/json" id="plan-state">'+j(st)+'<\/script>\n<script type="application/json" id="src-data">'+data+'<\/script>\n<script id="app-code">'+code+'<\/script>';
  const html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style></head><body>'+body+'</body></html>';
  try{try{localStorage.removeItem(DRAFT_KEY);}catch(e){}
    await artifactApi.publish(html);setStatus("Saved");}
  catch(e){const c=e&&e.code;
    if(c==="not_writer"||c==="not_granted"){readOnly=true;setStatus("This view is read-only: you can try numbers here, but cannot save them.");}
    else if(c==="conflict"){setStatus("Someone saved a newer plan; loading it.");}
    else setStatus("Not saved ("+(c||"error")+"). Your changes are kept in this browser.");
    try{localStorage.setItem(DRAFT_KEY,JSON.stringify({basedOn:STATE.savedAt||"seed",state:STATE}));}catch(_){}
  }finally{if(btn)btn.disabled=false;}
}
render();
})();
</script>
