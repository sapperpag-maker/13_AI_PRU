<style id="app-css">
:root{color-scheme:dark;--bg:#0B0D14;--card:#161A28;--ink:#F4F1EA;--muted:#A9B1C6;--line:#262B3D;--accent:#FFC21A;--on-accent:#0B0D14;--accent-soft:#2A2410;--good:#5cc489;--bad:#FF7A2E;--warn-bg:#3a3020;--warn-ink:#f1d28a;--input:#10131F;
--y2026:#FFC21A;--y2025:#B79CFF;--y2024:#5E9BFF;
--font:"Titillium Web","Segoe UI",system-ui,-apple-system,sans-serif}
:root[data-theme="light"]{color-scheme:light;--bg:#F6F4EF;--card:#FFFFFF;--ink:#16181F;--muted:#555C70;--line:#D9D5CB;--accent:#9A6B00;--on-accent:#FFFFFF;--accent-soft:#F3E7C6;--good:#1e7a46;--bad:#C2470F;--warn-bg:#fff4d6;--warn-ink:#6b4e00;--input:#FBFAF6;
--y2026:#9A6B00;--y2025:#5B3FC4;--y2024:#1F5FD1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
.wrap{max-width:1320px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:8px 0 16px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.ct{font-weight:700;margin-bottom:4px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;margin-bottom:12px}
.controls label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
select{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;background:var(--input);color:var(--ink);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.up{color:var(--good)}.down{color:var(--bad)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--card)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
tr.click{cursor:pointer}
tr.click:hover td,tr.sel td{background:var(--accent-soft)}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.note{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 0}
.legend span::before{content:"";display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--c)}
svg text{fill:var(--muted);font-size:11px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--input);color:var(--ink);border-radius:7px;padding:7px 12px;cursor:pointer}
@media (max-width:640px){h1{font-size:19px}.kpi .v{font-size:19px}}

 let extra="";if(dim!=="coach"&&m.pts)extra=" Fill leaves out the classes with no Limit: "+YRS.map(y=>{let ns=0;for(const r of DEM)if(r[0]===y&&r[1]<=W)ns+=r[9];return `${fmtN(ns)} in ${y}`;}).join(", ")+".";

 if(dim==="coach")extra=" A coach marked I2 or I3 is a helper, except on a row with no coach marked I, which goes to the coach in Instructor 1: "+YRS.map(y=>{let n1=0;for(const r of D.first_col)if(r[0]===y&&r[1]<=W)n1+=r[2];return `${fmtN(n1)} rows in ${y}`;}).join(", ")+". Rows with no coach in any Instructor column show as (no main coach). The ending is dropped, so each coach has one row. Where two different coaches are marked I on one row, the one in the first Instructor column gets the result: "+YRS.map(y=>{let n2=0;for(const r of D.two_main)if(r[0]===y&&r[1]<=W)n2+=r[2];return `${fmtN(n2)} rows in ${y}`;}).join(", ")+".";
 t+=`<div class="note">${esc(m.lab)}, weeks 1 to ${W} of each year. Source: ${esc(META.file)}, ${esc(m.src)}.${extra} Click a row to see it alone.</div>`;
 const c=card(`${m.lab} by ${label.toLowerCase()}`,t);
 c.querySelectorAll("tr[data-k]").forEach(tr=>tr.onclick=()=>{SEL[dim]=SEL[dim]===tr.dataset.k?"":tr.dataset.k;draw();});
 root.appendChild(c);
}
// Sergio Q31, "Show both": each coach's students (all rows), students tested and pass rate, side by side.
function coachTable(root,idx,names,label){
 const C=["rows","tested","pass"].map(k=>M[k]),n=YRS.length-1;
 const rowsT=names.map(nm=>({nm,v:C.map(m=>YRS.map(y=>total(m,ytd(y,r=>r[idx]===nm))))})).filter(o=>o.v[0].some(x=>x));
 rowsT.sort((a,b)=>(b.v[0][n]||0)-(a.v[0][n]||0));
 let t=`<div class="tw"><table><tr><th rowspan="2">${esc(label)}</th>${C.map(m=>`<th colspan="${YRS.length}">${esc(m.lab)}</th>`).join("")}<th rowspan="2">Pass rate ${Y} vs ${Y-1}</th></tr><tr>${C.map(()=>YRS.map(y=>`<th>${y}</th>`).join("")).join("")}</tr>`;
 const line=(cls,key,nm,v)=>`<tr class="${cls}"${key}><td>${esc(nm)}</td>${v.map((vs,i)=>vs.map(x=>`<td>${C[i].f(x)}</td>`).join("")).join("")}<td>${delta(M.pass,v[2][n],v[2][n-1])}</td></tr>`;
 rowsT.forEach(o=>{t+=line(`click${o.nm===SEL.coach?" sel":""}`,` data-k="${esc(o.nm)}"`,o.nm,o.v);});
 t+=line("tot","","All",C.map(m=>YRS.map(y=>total(m,ytd(y,ALL)))));
 let n1=YRS.map(y=>{let s=0;for(const r of D.first_col)if(r[0]===y&&r[1]<=W)s+=r[2];return `${fmtN(s)} rows in ${y}`;}).join(", ");
 let n2=YRS.map(y=>{let s=0;for(const r of D.two_main)if(r[0]===y&&r[1]<=W)s+=r[2];return `${fmtN(s)} rows in ${y}`;}).join(", ");
 t+=`</table></div><div class="note">Weeks 1 to ${W} of each year. Source: ${esc(META.file)}, ${esc(SS)}, Status and the three Instructor columns. Students, all rows: every student row, any status. Students tested: I-PASS plus the fails (I-FAILSKILL, I-FAILKNWLDG, I-FAILBOTH). Pass rate: I-PASS against students tested. Each row goes to the main coach, the one marked I; a coach marked I2 or I3 is a helper. A row with no coach marked I goes to the coach in Instructor 1: ${n1}. Rows with no coach in any Instructor column show as (no main coach). The ending is dropped, so each coach has one row. Where two different coaches are marked I on one row, the one in the first Instructor column gets the result: ${n2}. Click a row to see it alone.</div>`;
 const c=card(`Students and pass rate by ${label.toLowerCase()}`,t);
 c.querySelectorAll("tr[data-k]").forEach(tr=>tr.onclick=()=>{SEL.coach=SEL.coach===tr.dataset.k?"":tr.dataset.k;draw();});
 root.appendChild(c);
}
const TABS=[["overview","Overview",overview],["students","Students",students],
 ["ranges","Ranges",r=>dimTab(r,"site",2,["students","revenue","fill","classes"],"Range")],
 ["classes","Classes",r=>dimTab(r,"course",3,["students","revenue","fill","classes"],"Class type")],
 ["coaches","Coaches",r=>dimTab(r,"coach",4,["rows","tested","pass"],"Coach")]];
function draw(){
 const root=document.getElementById("root");root.innerHTML="";const w=el("div",{class:"wrap"});root.appendChild(w);
 const top=el("div",{class:"top"});
 top.appendChild(el("div",null,`<h1>PRU Weekly Dashboard</h1><p class="sub">Weeks 1 to ${W} of each year compared; ${Y} data to the week ending ${esc(META.asof)}. Source: ${esc(META.file)}, refreshed ${esc(META.built)}.</p>`));
 const tb=el("button",{class:"btn"},theme==="light"?"Dark":"Light");tb.onclick=()=>{theme=theme==="light"?"dark":"light";try{localStorage.setItem(THEME_KEY,theme);}catch(e){}applyTheme(theme);draw();};
 top.appendChild(tb);w.appendChild(top);
 const tabs=el("div",{class:"tabs",role:"tablist"});
 TABS.forEach(([k,l])=>{const b=el("button",{class:"tab",role:"tab","aria-selected":String(TAB===k)},l);b.onclick=()=>{TAB=k;draw();};tabs.appendChild(b);});
 w.appendChild(tabs);TABS.find(t=>t[0]===TAB)[2](w);
}
window.__PRU_DASH__={M,total,weekly,ytd,YRS,W,show:k=>{TAB=k;draw();}};
let lastW=chartW();window.addEventListener("resize",()=>{const w=chartW();if(Math.abs(w-lastW)>40){lastW=w;draw();}});
draw();
})();
